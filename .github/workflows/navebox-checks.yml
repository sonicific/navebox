name: Navebox integration checks

on:
  pull_request:
    paths:
      - '.github/workflows/navebox-checks.yml'
      - 'Config.kmk'
      - 'src/VBox/Artwork/Navebox/**'
      - 'src/VBox/Frontends/VirtualBox/**'
      - 'src/VBox/Installer/win/**'
  push:
    paths:
      - '.github/workflows/navebox-checks.yml'
      - 'Config.kmk'
      - 'src/VBox/Artwork/Navebox/**'
      - 'src/VBox/Frontends/VirtualBox/**'
      - 'src/VBox/Installer/win/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging-and-catalogs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            src/VBox/Frontends/VirtualBox
            src/VBox/Installer/win
            src/VBox/Artwork/Navebox
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check assets, installer entry points and translation catalogs
        run: python src/VBox/Frontends/VirtualBox/testcase/tstNaveboxPackaging.py
